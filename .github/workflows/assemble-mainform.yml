name: Assemble MainForm

on:
  push:
    paths:
      - '.source-parts/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble source when all parts exist
        shell: bash
        run: |
          set -euo pipefail
          expected=7
          count=$(find .source-parts -maxdepth 1 -type f -name 'MainForm.part*' 2>/dev/null | wc -l)
          if [ "$count" -ne "$expected" ]; then
            echo "Waiting for all $expected parts; currently have $count."
            exit 0
          fi
          cat $(printf '.source-parts/MainForm.part%02d ' {1..7}) > DriveclubSaveEditor/MainForm.cs
          test $(wc -l < DriveclubSaveEditor/MainForm.cs) -eq 2426
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DriveclubSaveEditor/MainForm.cs
          git rm -r .source-parts
          git rm .github/workflows/assemble-mainform.yml
          git commit -m 'Add main Windows Forms UI'
          git push
