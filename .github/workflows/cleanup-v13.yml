name: Clean v1.3 Source
on:
  push:
    paths:
      - '.github/workflows/cleanup-v13.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused source helpers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('DriveclubSaveEditor')

          p = root / 'LiveryAssets.cs'
          s = p.read_text()
          block = '''    internal static Choice? FindChoice(IEnumerable<Choice> choices, string? id)\n    {\n        if (id is null) return null;\n        return choices.FirstOrDefault(x => string.Equals(x.Id, id, StringComparison.Ordinal));\n    }\n\n'''
          if block not in s:
              raise SystemExit('Unused FindChoice block not found')
          p.write_text(s.replace(block, ''))

          p = root / 'MainForm.cs'
          s = p.read_text()
          blocks = [
          '''    private void PrepDriverLevel50(bool oneBelow)\n    {\n        ulong target = ProgressionData.FameForDriverRank(50);\n        if (oneBelow && target > 0) target--;\n        _driverFame.Value = Math.Min((decimal)target, _driverFame.Maximum);\n        _driverFameDirty = true;\n        UpdateDriverProgressPreview();\n        PopulateTrophyPrep();\n        SetStatus(oneBelow ? "Driver Fame set one point below the Rank 50 threshold." : "Driver Fame set to the Rank 50 threshold.");\n    }\n\n''',
          '''    private void PrepDriftTrophy(bool oneBelow)\n    {\n        SetStatValue1("Drift", oneBelow ? 999_999UL : 1_000_000UL);\n        PopulateStatistics();\n        PopulateTrophyPrep();\n        SetStatus(oneBelow ? "Drift total set to 999,999 for a one-action trigger setup." : "Drift total set to 1,000,000.");\n    }\n\n'''
          ]
          for block in blocks:
              if block not in s:
                  raise SystemExit('Unused trophy helper block not found')
              s = s.replace(block, '')
          p.write_text(s)
          PY
          ! grep -RniE 'FindChoice|PrepDriverLevel50|PrepDriftTrophy' DriveclubSaveEditor
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DriveclubSaveEditor/MainForm.cs DriveclubSaveEditor/LiveryAssets.cs
          git commit -m 'Remove unused source helpers'
          git push
