name: Apply UI Refresh

on:
  push:
    paths:
      - '.github/workflows/ui-refresh.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.2 UI refresh and remove donation code
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ui-refresh.patch.gz.b64 <<'PATCH64'
          
          PATCH64
          base64 -d /tmp/ui-refresh.patch.gz.b64 | gzip -d > /tmp/ui-refresh.patch
          git apply --check /tmp/ui-refresh.patch
          git apply /tmp/ui-refresh.patch
          ! grep -RniE 'donat|paypal|mohammedar@btinternet.com|ShowDonateDialog' DriveclubSaveEditor README.md
          grep -q '<Version>1.2.0</Version>' DriveclubSaveEditor/DriveclubSaveEditor.csproj
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DriveclubSaveEditor/MainForm.cs DriveclubSaveEditor/DriveclubSaveEditor.csproj README.md build.bat
          git rm .github/workflows/ui-refresh.yml
          git commit -m 'Remove donation feature and refresh UI'
          git push
